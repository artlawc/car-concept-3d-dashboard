
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealSpot Lucky Draw Prototype</title>
    <style>
        :root {
            --purple-bg: #1a0b36;
            --card-bg: #2d1654;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --gold: #ffd700;
            --mint: #00ffcc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0318;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #2d124d 0%, #0b0318 100%);
        }

        /* Phone frame wrapper for app demo feel */
        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 846px;
            background-color: var(--purple-bg);
            border: 8px solid #333;
            border-radius: 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* Header bar */
        .app-header {
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0));
        }

        .brand {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #fff, #b9a0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand span {
            color: var(--neon-cyan);
            -webkit-text-fill-color: var(--neon-cyan);
        }

        .coin-badge {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--gold);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Scrollable Content Area */
        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .app-content::-webkit-scrollbar { display: none; }

        .title-section {
            text-align: center;
            margin-bottom: 15px;
        }

        .title-section h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #b3a1df;
            margin-top: 4px;
        }

        /* Timer banner */
        .timer-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        .timer-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #b3a1df;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .timer-countdown {
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        /* Wheel Container Setup */
        .wheel-outer-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 30px;
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 40px;
            background: var(--neon-pink);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .wheel-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #2d1654;
            box-shadow: 0 0 0 4px var(--neon-cyan), 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wheel-center-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 0 4px var(--neon-pink);
            z-index: 5;
        }

        /* Control Panel Layout */
        .controls-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
            padding-bottom: 15px;
        }

        .btn {
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--mint) 0%, #00b3ff 100%);
            color: #0b0318;
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4);
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.6);
        }

        .btn-spin:disabled {
            background: #4a3b68;
            color: #8c7ba8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-booster {
            background: linear-gradient(135deg, var(--neon-pink) 0%, #b300ff 100%);
            color: white;
            font-size: 0.9rem;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
        }

        .btn-booster:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.5);
        }

        .btn-booster:disabled {
            background: #23123a;
            border: 1px solid rgba(255,255,255,0.05);
            color: #5d4b7c;
            box-shadow: none;
            cursor: not-allowed;
        }

        .booster-subtext {
            font-size: 0.75rem;
            font-weight: normal;
            opacity: 0.9;
            display: block;
        }

        /* Overlay modal for winning feedback */
        .toast-notification {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 255, 204, 0.95);
            color: #0b0318;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            text-align: center;
            width: 80%;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Bottom Nav Mock */
        .bottom-nav {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: #130728;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
        }

        .nav-item {
            font-size: 0.7rem;
            color: #79669e;
            text-align: center;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--neon-cyan);
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">Deal<span>Spot</span></div>
            <div class="coin-badge">
                🪙 <span id="coin-count">245</span> Coins
            </div>
        </header>

        <!-- Main Display Arena -->
        <main class="app-content">
            <div class="title-section">
                <h1>Lucky Draw</h1>
                <div class="subtitle" id="status-message">You have 1 free spin available!</div>
            </div>

            <!-- Lock / Unlock Timer Display -->
            <div class="timer-box">
                <div class="timer-label" id="timer-heading">Next Free Spin In</div>
                <div class="timer-countdown" id="countdown-display">00:00:00</div>
            </div>

            <!-- Spin Architecture -->
            <div class="wheel-outer-wrapper">
                <div class="wheel-pointer"></div>
                <div class="wheel-center-pin"></div>
                <div class="wheel-container" id="wheel-element">
                    <canvas id="wheel-canvas" class="wheel-canvas" width="600" height="600"></canvas>
                </div>
            </div>

            <div class="toast-notification" id="reward-toast">
                🎉 Won: Mystery Gift!
            </div>

            <div class="controls-panel">
                <button class="btn btn-spin" id="spin-btn">
                    Spin Now!
                </button>
                <button class="btn btn-booster" id="booster-btn" disabled>
                    <div>
                        ⚡ Speed-Up Booster
                        <span class="booster-subtext">Skip 15 minutes (-50 Coins)</span>
                    </div>
                </button>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item">
                <div class="nav-icon">🏠</div><div>Home</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">🔍</div><div>Search</div>
            </div>
            <div class="nav-item active">
                <div class="nav-icon">🎟️</div><div>Lucky Draw</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div><div>Profile</div>
            </div>
        </nav>
    </div>

    <script>
        // Configuration Parameters
        const prizes = [
            { text: "50% OFF", color: "#2d1654" },
            { text: "DEALSPOT PLUS", color: "#00b3ff" },
            { text: "$50 OFF", color: "#2d1654" },
            { text: "10% OFF", color: "#ff007f" },
            { text: "MYSTERY GIFT", color: "#2d1654" },
            { text: "$20 VOUCHER", color: "#b300ff" },
            { text: "FREE SHIPPING", color: "#2d1654" },
            { text: "5 COINS", color: "#ffd700" }
        ];

        let currentCoins = 245;
        let timeRemainingSeconds = 0; 
        let countdownInterval = null;
        let isSpinning = false;
        let currentRotation = 0;

        // Dom Query Selector Targets
        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        const wheelElement = document.getElementById('wheel-element');
        const spinBtn = document.getElementById('spin-btn');
        const boosterBtn = document.getElementById('booster-btn');
        const countdownDisplay = document.getElementById('countdown-display');
        const timerHeading = document.getElementById('timer-heading');
        const statusMessage = document.getElementById('status-message');
        const coinCountDisplay = document.getElementById('coin-count');
        const toast = document.getElementById('reward-toast');

        // Draw sectors onto asset surface
        function drawWheel() {
            const numSectors = prizes.length;
            const arcSize = (2 * Math.PI) / numSectors;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSectors; i++) {
                const angle = i * arcSize;
                
                // Draw Slices
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 10, angle, angle + arcSize);
                ctx.lineTo(radius, radius);
                ctx.fill();
                
                // Stroke separator lines
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Project Typography Labels
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                // Color formatting matching item contrast profile
                ctx.fillStyle = prizes[i].color === "#2d1654" ? "#ffffff" : "#0b0318";
                ctx.font = "bold 22px sans-serif";
                
                // Draw text elements offset from boundary rim
                ctx.fillText(prizes[i].text, radius - 40, 0);
                ctx.restore();
            }
        }

        // Timer Execution Engines
        function formatTime(totalSeconds) {
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSeconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function updateTimerUI() {
            if (timeRemainingSeconds <= 0) {
                countdownDisplay.textContent = "00:00:00";
                timerHeading.textContent = "Status Available";
                statusMessage.textContent = "You have 1 free spin available!";
                spinBtn.disabled = false;
                boosterBtn.disabled = true;
                clearInterval(countdownInterval);
            } else {
                countdownDisplay.textContent = formatTime(timeRemainingSeconds);
                timerHeading.textContent = "Next Free Spin In";
                statusMessage.textContent = "No free spins remaining";
                spinBtn.disabled = true;
                boosterBtn.disabled = currentCoins < 50;
            }
        }

        function startTimer(durationSeconds) {
            clearInterval(countdownInterval);
            timeRemainingSeconds = durationSeconds;
            updateTimerUI();

            countdownInterval = setInterval(() => {
                if (timeRemainingSeconds > 0) {
                    timeRemainingSeconds--;
                    updateTimerUI();
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        // Spin Physics Simulator Implementation
        spinBtn.addEventListener('click', () => {
            if (isSpinning || timeRemainingSeconds > 0) return;

            isSpinning = true;
            spinBtn.disabled = true;
            boosterBtn.disabled = true;

            const totalSectors = prizes.length;
            const randomSectorIndex = Math.floor(Math.random() * totalSectors);
            
            const sectorDegrees = 360 / totalSectors;
            // Balance rotation targeting math (-90 offset matches the top vertical needle point)
            const targetRotation = 360 - (randomSectorIndex * sectorDegrees) - (sectorDegrees / 2) - 90;
            
            const extraSpins = 5 * 360; 
            currentRotation += extraSpins + targetRotation;

            wheelElement.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const wonPrize = prizes[randomSectorIndex];
                
                showToast(`🎉 Won: ${wonPrize.text}`);
                startTimer(3600); 
            }, 4000); 
        });

        // Boost Engine Mechanism Modifier
        boosterBtn.addEventListener('click', () => {
            if (currentCoins < 50 || timeRemainingSeconds <= 0 || isSpinning) return;

            currentCoins -= 50;
            coinCountDisplay.textContent = currentCoins;

            const penaltyReduction = 15 * 60; 
            timeRemainingSeconds = Math.max(0, timeRemainingSeconds - penaltyReduction);
            
            showToast("⚡ Time Boosted by 15 Mins!");
            updateTimerUI();
        });

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Document Initialization Hooks
        drawWheel();
        updateTimerUI(); 
    </script>
</body>
</html>
