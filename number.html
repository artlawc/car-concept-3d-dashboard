
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timely Particle Morphing Timer</title>
    <style>
        :root {
            --glow-color: #ff5500;
            --bg-color: #0a0502;
            --panel-color: #140b05;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: linear-gradient(145deg, var(--panel-color), #000);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 
                        inset 0 1px 2px rgba(255, 85, 0, 0.2);
            border: 1px solid rgba(255, 85, 0, 0.1);
            z-index: 10;
        }

        #timer-canvas {
            display: block;
            margin: 0 auto;
            background: #000;
            border-radius: 10px;
            box-shadow: inset 0 0 30px rgba(255, 85, 0, 0.15);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        input[type="number"] {
            width: 80px;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--glow-color);
            box-shadow: 0 0 10px rgba(255, 85, 0, 0.3);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 85, 0, 0.6);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-shadow: 0 0 5px rgba(255, 85, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 85, 0, 0.1);
        }

        button:hover {
            background: var(--glow-color);
            color: #000;
            border-color: var(--glow-color);
            box-shadow: 0 0 20px var(--glow-color);
            text-shadow: none;
        }

        button:active {
            transform: scale(0.97);
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="label">Nixie Particle Timer</div>
        <canvas id="timer-canvas" width="700" height="180"></canvas>
        
        <div class="controls">
            <input type="number" id="seconds-input" min="1" max="9999" value="60" title="Seconds">
            <button id="start-btn">START</button>
            <button id="reset-btn">RESET</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('timer-canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const secondsInput = document.getElementById('seconds-input');

        let countdownSecs = parseInt(secondsInput.value, 10);
        let timerInterval = null;
        let targetTimeStr = "";

        const TRANSITION_DURATION = 800; // ms
        const DIGIT_WIDTH = 75;
        const START_X = 70;
        const START_Y = 40;

        function cubicBezier(t) {
            return 1 - Math.pow(1 - t, 4); // Smooth OutQuart curve
        }

        // Geometric definitions of standard digits (7-segment logic converted to point arrays)
        // This ensures numbers draw perfectly regardless of local browser font packages.
        const segmentMap = {
            'A': [[10,10], [65,10]],
            'B': [[65,10], [65,55]],
            'C': [[65,55], [65,100]],
            'D': [[10,100], [65,100]],
            'E': [[10,55], [10,100]],
            'F': [[10,10], [10,55]],
            'G': [[10,55], [65,55]]
        };

        const digitSegments = {
            '0': ['A', 'B', 'C', 'D', 'E', 'F'],
            '1': ['B', 'C'],
            '2': ['A', 'B', 'G', 'E', 'D'],
            '3': ['A', 'B', 'G', 'C', 'D'],
            '4': ['F', 'G', 'B', 'C'],
            '5': ['A', 'F', 'G', 'C', 'D'],
            '6': ['A', 'F', 'E', 'D', 'C', 'G'],
            '7': ['A', 'B', 'C'],
            '8': ['A', 'B', 'C', 'D', 'E', 'F', 'G'],
            '9': ['A', 'B', 'C', 'D', 'F', 'G'],
            ':': ['COLON'],
            ' ': []
        };

        const digitTargets = {};

        function generatePointsFromSegments() {
            Object.keys(digitSegments).forEach(char => {
                let points = [];
                const segments = digitSegments[char];

                if (char === ':') {
                    // Create direct coordinate clusters for colon nodes
                    for(let i=0; i<15; i++) points.push({x: 20 + Math.random()*6, y: 35 + Math.random()*6});
                    for(let i=0; i<15; i++) points.push({x: 20 + Math.random()*6, y: 75 + Math.random()*6});
                    digitTargets[char] = points;
                    return;
                }

                segments.forEach(segKey => {
                    const line = segmentMap[segKey];
                    const p1 = line[0];
                    const p2 = line[1];
                    const steps = 16; // Number of particles per stroke segment
                    
                    for(let i=0; i<=steps; i++) {
                        let t = i / steps;
                        points.push({
                            x: p1[0] + (p2[0] - p1[0]) * t + (Math.random() - 0.5) * 2,
                            y: p1[1] + (p2[1] - p1[1]) * t + (Math.random() - 0.5) * 2
                        });
                    }
                });

                // Fallback coordinates if an empty space or missing character is invoked
                if (points.length === 0) {
                    points.push({x: 37, y: 55, dummy: true});
                }
                digitTargets[char] = points;
            });
        }

        class ManagedDigit {
            constructor(slotIndex) {
                this.slotIndex = slotIndex;
                this.currentIdxX = START_X + slotIndex * (DIGIT_WIDTH + 25);
                if (slotIndex > 2) this.currentIdxX -= 40; // Formatting compression pass

                this.particles = [];
                this.currentChar = " ";
                this.transitionStartTime = 0;
                this.isTransitioning = false;
            }

            morphTo(newChar) {
                if (this.currentChar === newChar && this.particles.length > 0) return;
                
                const sourcePoints = digitTargets[this.currentChar] || [{x: 37, y: 55, dummy: true}];
                const targetPoints = digitTargets[newChar] || [{x: 37, y: 55, dummy: true}];
                
                this.particles = [];
                this.isTransitioning = true;
                this.transitionStartTime = performance.now();
                this.currentChar = newChar;

                const maxLen = Math.max(sourcePoints.length, targetPoints.length);

                for (let i = 0; i < maxLen; i++) {
                    const src = sourcePoints[i % sourcePoints.length];
                    const tgt = targetPoints[i % targetPoints.length];

                    this.particles.push({
                        sx: src.x + this.currentIdxX,
                        sy: src.y + START_Y,
                        tx: tgt.x + this.currentIdxX,
                        ty: tgt.y + START_Y,
                        x: src.x + this.currentIdxX,
                        y: src.y + START_Y,
                        size: Math.random() * 2 + 1.5,
                        alpha: src.dummy ? 0 : 1,
                        targetAlpha: tgt.dummy ? 0 : 1,
                        vx: (Math.random() - 0.5) * 25,
                        vy: (Math.random() - 0.5) * 25
                    });
                }
            }

            update(now) {
                if (!this.isTransitioning) return;

                const elapsed = now - this.transitionStartTime;
                let progress = Math.min(elapsed / TRANSITION_DURATION, 1);
                let easedProgress = cubicBezier(progress);

                this.particles.forEach(p => {
                    const dx = p.tx - p.sx;
                    const dy = p.ty - p.sy;
                    const burstFactor = Math.sin(progress * Math.PI); 

                    p.x = p.sx + dx * easedProgress + (p.vx * burstFactor * (1 - progress));
                    p.y = p.sy + dy * easedProgress + (p.vy * burstFactor * (1 - progress));
                    p.alpha = p.alpha + (p.targetAlpha - p.alpha) * easedProgress;
                });

                if (progress >= 1) {
                    this.isTransitioning = false;
                    this.particles = (digitTargets[this.currentChar] || []).map(pt => ({
                        x: pt.x + this.currentIdxX,
                        y: pt.y + START_Y,
                        size: Math.random() * 2 + 1.5,
                        alpha: pt.dummy ? 0 : 1
                    }));
                }
            }

            draw() {
                this.particles.forEach(p => {
                    if (p.alpha <= 0.01) return;
                    ctx.fillStyle = `rgba(255, 95, 10, ${p.alpha})`;
                    ctx.shadowColor = 'rgba(255, 60, 0, 1)';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
            }
        }

        const slots = [
            new ManagedDigit(0), // M
            new ManagedDigit(1), // M
            new ManagedDigit(2), // :
            new ManagedDigit(3), // S
            new ManagedDigit(4)  // S
        ];

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerString() {
            targetTimeStr = formatTime(countdownSecs);
            for (let i = 0; i < slots.length; i++) {
                slots[i].morphTo(targetTimeStr[i]);
            }
        }

        function tick() {
            if (countdownSecs <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                startBtn.innerText = "START";
                return;
            }
            countdownSecs--;
            updateTimerString();
        }

        function animate(now) {
            ctx.shadowBlur = 0;
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'screen';

            slots.forEach(slot => {
                slot.update(now);
                slot.draw();
            });

            requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', () => {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                startBtn.innerText = "START";
            } else {
                if (countdownSecs <= 0) {
                    countdownSecs = parseInt(secondsInput.value, 10) || 60;
                    updateTimerString();
                }
                timerInterval = setInterval(tick, 1000);
                startBtn.innerText = "PAUSE";
            }
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            startBtn.innerText = "START";
            countdownSecs = parseInt(secondsInput.value, 10) || 60;
            updateTimerString();
        });

        secondsInput.addEventListener('change', () => {
            if (!timerInterval) {
                countdownSecs = parseInt(secondsInput.value, 10) || 60;
                updateTimerString();
            }
        });

        // Initialize setup sequence
        generatePointsFromSegments();
        updateTimerString();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
