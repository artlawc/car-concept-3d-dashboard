
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Glitch Transition Demo</title>
    <style>
        :root {
            --cyber-yellow: #fcee0a;
            --cyber-cyan: #00f0ff;
            --cyber-magenta: #ff0055;
            --cyber-dark: #030303;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--cyber-dark);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container keeping everything aligned */
        .viewport {
            position: relative;
            width: 800px;
            height: 450px;
            border: 2px solid #222;
            background: #111;
            overflow: hidden;
            cursor: pointer;
        }

        /* Base styling for both states */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Source State (What disappears) */
        .slide-old {
            background: var(--cyber-yellow);
            color: black;
            z-index: 2;
        }

        /* Destination State (What appears) */
        .slide-new {
            background: #000;
            color: var(--cyber-cyan);
            border: 4px solid var(--cyber-cyan);
            z-index: 1;
        }

        .slide h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        /* Glitch Component Overlays */
        .glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            display: none;
            mix-blend-mode: exclusion;
        }

        /* Trigger class handled by JS */
        .viewport.animating .slide-old {
            animation: flowCollapse 0.6s cubic-bezier(0.15, 0.85, 0.3, 1) forwards;
        }

        .viewport.animating .glitch-overlay {
            display: block;
            /* Combines horizontal displacement simulation, chromatic flash, and pixel drag tear */
            animation: 
                horizontalTear 0.4s steps(4) infinite, 
                chromaticAberration 0.5s linear forwards,
                pixelLagFade 0.6s ease-in forwards;
        }

        /* Instruction UI */
        .hint {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 2px;
            z-index: 10;
            pointer-events: none;
        }

        /* --- PHYSICS & ANIMATION ENGINE --- */

        /* 1. The Main Flow & Dissolve collapse */
        @keyframes flowCollapse {
            0% {
                clip-path: inset(0% 0% 0% 0%);
                transform: scale(1) skewX(0deg);
                filter: brightness(1);
            }
            30% {
                clip-path: inset(10% 0% 40% 0%);
                transform: scaleY(0.9) skewX(-10deg);
                filter: brightness(2);
            }
            60% {
                clip-path: inset(45% 0% 48% 0%); /* Stripped down to a razor pixel tear line */
                transform: scaleX(1.3) skewX(30deg);
            }
            99% {
                clip-path: inset(50% 0% 50% 0%);
                transform: scaleX(2);
                opacity: 1;
            }
            100% {
                clip-path: inset(50% 0% 50% 0%);
                opacity: 0;
                visibility: hidden;
            }
        }

        /* 2. Rapid Horizontal Segmented Tears (Displacement Map Sim) */
        @keyframes horizontalTear {
            0% {
                clip-path: inset(12% 0% 75% 0%);
                transform: translateX(-40px) skewX(-20deg);
                background-color: var(--cyber-magenta);
            }
            25% {
                clip-path: inset(40% 0% 42% 0%);
                transform: translateX(60px) scaleY(1.5);
                background-color: var(--cyber-cyan);
            }
            50% {
                clip-path: inset(70% 0% 15% 0%);
                transform: translateX(-25px) skewX(15deg);
                background-color: var(--cyber-yellow);
            }
            75% {
                clip-path: inset(85% 0% 2% 0%);
                transform: translateX(35px);
                background-color: #fff;
            }
            100% {
                clip-path: inset(30% 0% 60% 0%);
                transform: translateX(-50px);
            }
        }

        /* 3. RGB Channels Shifting split */
        @keyframes chromaticAberration {
            0% {
                text-shadow: 4px 0 0 var(--cyber-magenta), -4px 0 0 var(--cyber-cyan);
            }
            50% {
                text-shadow: -10px 2px 0 var(--cyber-magenta), 8px -2px 0 var(--cyber-cyan);
            }
            100% {
                text-shadow: 0px 0 0 var(--cyber-magenta), 0px 0 0 var(--cyber-cyan);
            }
        }

        /* 4. Digital System Lag Disappear (Melt / Dissolve) */
        @keyframes pixelLagFade {
            0% {
                opacity: 1;
                filter: blur(0px) contrast(1);
            }
            50% {
                opacity: 0.9;
                filter: blur(2px) contrast(3) brightness(2);
            }
            100% {
                opacity: 0;
                filter: blur(20px) cv-extract(0);
                visibility: hidden;
            }
        }
    </style>
</head>
<body>

    <div class="viewport" id="stage">
        <!-- Target Disappearing Matrix -->
        <div class="slide slide-old">
            <h1>SYSTEM_ONLINE</h1>
            <p>DATA UNIT: 2077</p>
            
            <!-- Hidden Glitch Elements driven by animation class -->
            <div class="glitch-overlay"></div>
        </div>

        <!-- Target Appearing Matrix -->
        <div class="slide slide-new">
            <h1>CRITICAL_ERROR</h1>
            <p>BREACH DETECTED // DISCONNECTED</p>
        </div>

        <div class="hint">CLICK CONSOLE TO TRIGGER TRANSITION</div>
    </div>

    <script>
        const stage = document.getElementById('stage');
        
        stage.addEventListener('click', () => {
            // Avoid overlapping triggers
            if (stage.classList.contains('animating')) return;
            
            stage.classList.add('animating');
            
            // Hard reset back to original state after loop finishes
            setTimeout(() => {
                stage.classList.remove('animating');
            }, 1200); 
        });
    </script>
</body>
</html>
